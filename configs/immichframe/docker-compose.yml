# ImmichFrame (chapter 9). Inside its own small Docker container:
#   mkdir -p /opt/immichframe/config && cd /opt/immichframe
#   put this file here and config/Settings.yml next to it, then: docker compose up -d
name: immichframe
services:
  immichframe:
    container_name: immichframe
    image: ghcr.io/immichframe/immichframe:latest
    restart: on-failure
    volumes:
      - ./config:/app/Config
    ports:
      - "8080:8080"
    environment:
      TZ: "<your/Timezone>"
